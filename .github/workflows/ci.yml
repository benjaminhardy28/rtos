name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RENODE_VERSION: "1.16.1"

jobs:
  build:
    name: build (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stm32f103 is the main board; mps2-an385 (QEMU-compatible) is
        # kept building too since it's still a supported target.
        board: [stm32f103, mps2-an385]
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Build
        run: make build RENODE_BOARD=${{ matrix.board }}

      - name: Report size
        run: arm-none-eabi-size build/rtos.elf

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: rtos-${{ matrix.board }}.elf
          path: build/rtos.elf

  boot-smoke-test:
    name: boot smoke test (stm32f103, Renode)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Build (stm32f103)
        run: make build RENODE_BOARD=stm32f103

      - name: Install Renode (portable)
        run: |
          mkdir -p "$HOME/renode_portable"
          curl -fsSL -o /tmp/renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          tar xf /tmp/renode.tar.gz -C "$HOME/renode_portable" --strip-components=1
          echo "$HOME/renode_portable" >> "$GITHUB_PATH"

      - name: Run boot smoke test
        run: |
          python3 scripts/ci/boot_smoke_test.py \
            --elf build/rtos.elf \
            --platform scripts/renode/stm32f103.repl \
            --renode "$HOME/renode_portable/renode"
