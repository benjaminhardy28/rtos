# Real-hardware debug + RTT logging for the "Blue Pill" stm32f103c8t6
# board (linker/stm32f103c8t6.ld, RAM_USER 0x20000000-0x20004000). Needs
# an external ST-Link V2 (or clone) wired to SWDIO/SWCLK/GND/3V3[/NRST]
# -- unlike a Nucleo, this board has no onboard probe.
#
# Usage: openocd -f scripts/openocd/stm32f103c8t6_rtt.cfg
#   then: arm-none-eabi-gdb build/rtos.elf -ex "target remote :3333"
#     and: nc localhost 9090   (RTT up-channel 0 -- os_rtt_write() output)

source [find interface/stlink.cfg]
source [find target/stm32f1x.cfg]

init

# g_rtt_cb (see kernel/rtt.c) always lands at the base of RAM_USER since
# it's the first .data.user symbol -- scanning the full 16K RAM_USER
# region is generous but cheap, and doesn't need updating if that stops
# being true.
rtt setup 0x20000000 0x4000 "SEGGER RTT"
rtt start
rtt server start 9090 0
