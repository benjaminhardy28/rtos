# Real-hardware debug + RTT logging for the high-density stm32f103 board
# (linker/stm32f103.ld, RAM_USER 0x20000000-0x20008000). Analogous to
# scripts/renode/stm32f103_debug.resc's StartGdbServer, but talking to a
# real ST-Link over SWD instead of Renode's emulated GDB stub.
#
# Usage: openocd -f scripts/openocd/stm32f103_rtt.cfg
#   then: arm-none-eabi-gdb build/rtos.elf -ex "target remote :3333"
#     and: nc localhost 9090   (RTT up-channel 0 -- os_rtt_write() output)

source [find interface/stlink.cfg]
source [find target/stm32f1x.cfg]

init

# g_rtt_cb (see kernel/rtt.c) always lands at the base of RAM_USER since
# it's the first .data.user symbol -- scanning the full 32K RAM_USER
# region is generous but cheap, and doesn't need updating if that stops
# being true.
rtt setup 0x20000000 0x8000 "SEGGER RTT"
rtt start
rtt server start 9090 0
